services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.1
    container_name: redpanda-local
    command:
      - redpanda start
      - --overprovisioned
      - --smp ${REDPANDA_SMP:-1}
      - --memory ${REDPANDA_MEMORY:-1G}
      - --kafka-addr INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      - --advertise-kafka-addr INTERNAL://redpanda:9092,EXTERNAL://127.0.0.1:19092
      - --set redpanda.default_topic_partitions=${NUM_WORKERS:-4}
    ports:
      - "19092:19092"
      - "8082:8082"
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 2s
      timeout: 5s
      retries: 15

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.1
    container_name: redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        rpk topic create liquidity_transactions -p ${NUM_WORKERS:-4} --brokers redpanda:9092 || true

  console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    container_name: redpanda-console
    environment:
      KAFKA_BROKERS: "redpanda:9092"
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy
